name: Deploy Modal Artwork App

# `modal_app.py` is where artwork is actually GENERATED — the Roastify POST, the poll
# loop, the fare. Horizon only dispatches; the work runs in this container.
#
# eXcalibur learned this the expensive way: its Modal app was pushed by hand once, then
# main moved. A release raised a budget and bumped the SDK, both shipped to Horizon, and
# neither reached Modal. For a full day the dispatcher intended one ceiling while the
# container silently enforced the old one. The release was green, tagged, and inert.
#
# The image is built from `pyproject.toml` and mounts `roastify_mcp` at DEPLOY time.
# `add_local_python_source(copy=False)` skips an image *rebuild* on a code change — it
# does not skip the redeploy. So a source change with no redeploy means Modal is running
# code that no longer exists anywhere else. Hence the broad paths filter below: this is
# not a "modal_app.py changed" trigger, it is a "what Modal executes changed" trigger.
on:
  push:
    branches: [main]
    paths:
      - "modal_app.py"
      - "src/roastify_mcp/**"
      - "pyproject.toml"
      - ".github/workflows/deploy-modal.yml"
  # The release gate. `release.yml` creates the GitHub Release on a `v*` tag; this fires
  # on that, and checks out the RELEASED tag rather than whatever main has drifted to —
  # so the container ends up running the commit that was actually released.
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  # Two deploys racing would leave the live version decided by whichever finished last.
  group: deploy-modal
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The image runs `pip_install_from_pyproject`, so a pin that has not landed on
      # PyPI yet fails the build rather than merely resolving late. Same wait as ci.yml.
      - name: Wait for tollbooth-dpyc on PyPI
        run: |
          REQUIRED=$(grep 'tollbooth-dpyc' pyproject.toml | grep -oP '==\K[0-9.]+')
          if [ -n "$REQUIRED" ]; then
            echo "Waiting for tollbooth-dpyc==$REQUIRED on PyPI..."
            for i in $(seq 1 30); do
              if pip index versions tollbooth-dpyc 2>/dev/null | grep -q "$REQUIRED"; then
                echo "Found tollbooth-dpyc==$REQUIRED on PyPI"
                break
              fi
              echo "Attempt $i/30 — not yet available, waiting 10s..."
              sleep 10
            done
          fi

      # The `modal` client comes from the project's own pin — `tollbooth-dpyc[modal]` —
      # so the CLI performing the deploy is the one this project runs with, not a
      # floating latest.
      - name: Install dependencies
        run: pip install -e ".[dev]"

      # `timeout=get_settings().artwork_runner_timeout_s` in modal_app.py is evaluated on
      # THIS runner at deploy time, not in the container. An env override here would bake
      # an outermost ring that disagrees with the job store's attempt ceiling — a
      # generation killed while the store still thinks it owns the claim. Deploy with the
      # defaults the service runs, and say which rings are being baked in.
      - name: Show the rings being baked in
        run: |
          set -euo pipefail
          if env | grep -qi '^ARTWORK_'; then
            echo "::error::ARTWORK_* is set on the runner; the baked timeout would not match the service"
            env | grep -i '^ARTWORK_'
            exit 1
          fi
          python -c "from roastify_mcp.config import get_settings as g; s=g(); print(f'poll={s.artwork_poll_budget_s} attempt={s.artwork_job_attempt_s} runner={s.artwork_runner_timeout_s}')"

      # A DEPLOY credential, deliberately not the operator's identity.
      #
      # Two different things are needed to run a service, and the platforms already keep
      # them apart. What the service RUNS AS is the operator nsec — set once in Horizon's
      # env and, for the container, in the Modal Secret `roastify-operator`. What
      # AUTHORIZES a deploy is a platform token. This job only performs the second, so it
      # holds only the second.
      #
      # The tempting alternative was to give CI the nsec and read the Modal tokens out of
      # the operator vault, which is where their delivery to the RUNTIME is codified.
      # That would hand a build runner the credential that unlocks every operator secret
      # — BTCPay, every patron's Roastify key — in order to obtain the weakest one in the
      # system. A Modal token can redeploy an app; it cannot open the vault.
      #
      # The invariant is "the live container runs THIS commit's content" — which is not
      # the same as "a version stamped with this commit exists".
      #
      # Modal deduplicates: when the image, the function spec and the mounted source are
      # byte-identical to what is already live, it creates no new version and says
      # "no changes detected". That is the invariant HOLDING, not failing. It is also the
      # common case, because the paths filter above is deliberately wider than the image:
      # a merge touching only CI config, tests or docs correctly changes nothing to run.
      - name: Deploy to Modal and verify the live version
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          APP=$(python -c "import modal_app; print(modal_app.app.name)")
          EXPECTED=$(git rev-parse --short HEAD)

          # tee so the deploy output is still in the log we are asserting against.
          modal deploy modal_app.py 2>&1 | tee "$RUNNER_TEMP/modal-deploy.log"

          if grep -q 'no changes detected' "$RUNNER_TEMP/modal-deploy.log"; then
            echo "$APP already runs this commit's content — Modal cut no new version."
            exit 0
          fi

          # A new version WAS cut, so it must carry this commit. Modal stamps each
          # version with the commit it was deployed from; anything else means the deploy
          # took from a tree that is not the one we checked out.
          HISTORY=$(COLUMNS=200 modal app history "$APP")
          echo "$HISTORY"
          if ! echo "$HISTORY" | grep -q "$EXPECTED"; then
            echo "::error::$APP cut a new version, but not at $EXPECTED"
            exit 1
          fi
          echo "$APP is live at $EXPECTED"
