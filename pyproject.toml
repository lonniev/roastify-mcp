[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "roastify-mcp"
version = "0.22.6"
description = "Roastify Developer API MCP Service — Tollbooth DPYC monetization"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Lonnie VanZandt" }]

dependencies = [
    "fastmcp>=3.4.7",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "tollbooth-dpyc[nostr]==0.88.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
